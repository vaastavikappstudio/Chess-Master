<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Master by Vaastavik App Studio</title>
    <style>
        :root {
            --primary-color: #4a6572;
            --secondary-color: #344955;
            --accent-color: #f9aa33;
            --light-square: #f0d9b5;
            --dark-square: #b58863;
            --highlight: rgba(249, 170, 51, 0.5);
            --text-light: #ffffff;
            --text-dark: #333333;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --neumorphism: inset 2px 2px 5px rgba(255, 255, 255, 0.5),
                           inset -2px -2px 5px rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --light-square: #eeeed2;
            --dark-square: #769656;
            --text-light: #f0f0f0;
            --text-dark: #222222;
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            transition: background 0.3s;
        }

        .screen {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        /* Header Styles */
        header {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            text-align: center;
        }

        /* Button Styles */
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            width: 100%;
            max-width: 300px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: var(--accent-color);
            color: var(--text-dark);
        }

        .btn-primary:hover {
            background: #ffb74d;
        }

        /* Home Screen Styles */
        .game-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            align-items: center;
        }

        .option-group {
            width: 100%;
            max-width: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            box-shadow: var(--shadow);
        }

        .option-title {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: var(--accent-color);
            text-align: center;
        }

        .option-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .option-btn {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        .option-btn.active {
            background: var(--accent-color);
            color: var(--text-dark);
        }

        /* Settings Styles */
        .settings-group {
            width: 100%;
            max-width: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            box-shadow: var(--shadow);
            margin-bottom: 15px;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .setting-label {
            font-size: 0.9rem;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.2);
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-color);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        select {
            padding: 5px 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Game Screen Styles */
        .game-controls {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            box-shadow: var(--shadow);
        }

        .player-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .player-name {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .timer {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .current-turn {
            border-bottom: 2px solid var(--accent-color);
        }

        /* Chessboard */
        .chessboard-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            box-shadow: var(--shadow);
            border-radius: 8px;
            overflow: hidden;
        }

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
            border: 2px solid var(--secondary-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .square {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .light {
            background-color: var(--light-square);
        }

        .dark {
            background-color: var(--dark-square);
        }

        .selected {
            background-color: var(--highlight);
        }

        .possible-move::after {
            content: '';
            position: absolute;
            width: 25%;
            height: 25%;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.3);
        }

        .possible-capture::after {
            content: '';
            position: absolute;
            width: 90%;
            height: 90%;
            border-radius: 50%;
            border: 4px solid rgba(0, 0, 0, 0.3);
        }

        .coordinates {
            position: absolute;
            font-size: 0.8rem;
            color: var(--text-dark);
            pointer-events: none;
        }

        .file-coord {
            bottom: 2px;
            right: 4px;
        }

        .rank-coord {
            top: 2px;
            left: 4px;
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: var(--secondary-color);
            padding: 25px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            max-width: 90%;
            width: 400px;
            text-align: center;
        }

        .modal h2 {
            margin-bottom: 15px;
            color: var(--accent-color);
        }

        .modal p {
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        /* Responsive Adjustments */
        @media (max-width: 500px) {
            .square {
                font-size: 2rem;
            }
            
            .btn {
                padding: 10px 15px;
                font-size: 0.9rem;
            }
            
            .timer {
                font-size: 1rem;
            }
            
            .logo {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Home Screen -->
    <div class="screen" id="homeScreen">
        <header>
            <div class="logo">Chess Master by Vaastavik App Studio</div>
        </header>

        <div class="game-options">
            <div class="option-group">
                <div class="option-title">Game Mode</div>
                <div class="option-buttons">
                    <button class="option-btn active" id="singlePlayerBtn">Single Player</button>
                    <button class="option-btn" id="twoPlayerBtn">Two Player</button>
                </div>
            </div>

            <div class="option-group">
                <div class="option-title">Difficulty</div>
                <div class="option-buttons">
                    <button class="option-btn active" data-difficulty="easy">Easy</button>
                    <button class="option-btn" data-difficulty="medium">Medium</button>
                    <button class="option-btn" data-difficulty="hard">Hard</button>
                </div>
            </div>

            <div class="settings-group">
                <div class="option-title">Game Settings</div>
                <div class="setting-item">
                    <div class="setting-label">Game Time</div>
                    <select id="gameTime">
                        <option value="300">5 minutes</option>
                        <option value="600" selected>10 minutes</option>
                        <option value="900">15 minutes</option>
                        <option value="1800">30 minutes</option>
                    </select>
                </div>
            </div>

            <div class="settings-group">
                <div class="option-title">Appearance</div>
                <div class="setting-item">
                    <div class="setting-label">Theme</div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="themeToggle">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="setting-item">
                    <div class="setting-label">Sound</div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="soundToggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <button class="btn btn-primary" id="startGameBtn">Start Game</button>
        </div>
    </div>

    <!-- Game Screen -->
    <div class="screen" id="gameScreen" style="display: none;">
        <header>
            <div class="logo">Chess Master</div>
        </header>

        <div class="game-info">
            <div class="player-info" id="whitePlayer">
                <div class="player-name">White</div>
                <div class="timer" id="whiteTimer">10:00</div>
            </div>
            <div class="player-info" id="blackPlayer">
                <div class="player-name">Black</div>
                <div class="timer" id="blackTimer">10:00</div>
            </div>
        </div>

        <div class="chessboard-container">
            <div class="chessboard" id="chessboard">
                <!-- Chessboard squares will be generated by JavaScript -->
            </div>
        </div>

        <div class="game-controls">
            <button class="btn" id="undoBtn">↩️ Undo</button>
            <button class="btn" id="switchSidesBtn">🔄 Switch Sides</button>
            <button class="btn btn-primary" id="newGameBtn">🆕 New Game</button>
            <button class="btn" id="homeBtn">🏠 Home</button>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div class="modal" id="gameOverModal">
        <div class="modal-content">
            <h2 id="gameResult">Checkmate!</h2>
            <p id="gameResultMessage">White wins by checkmate</p>
            <div class="modal-buttons">
                <button class="btn" id="rematchBtn">🔄 Rematch</button>
                <button class="btn btn-primary" id="closeModalBtn">Close</button>
            </div>
        </div>
    </div>

    <script>
        // Game state
        const gameState = {
            board: [],
            currentPlayer: 'white',
            selectedPiece: null,
            possibleMoves: [],
            gameMode: 'singlePlayer', // 'singlePlayer' or 'twoPlayer'
            gameActive: false,
            timers: {
                white: 600, // 10 minutes in seconds
                black: 600
            },
            timerInterval: null,
            moveHistory: [],
            difficulty: 'easy',
            soundEnabled: true,
            theme: 'light',
            undoCount: 0
        };

        // Piece representations
        const pieces = {
            white: {
                king: '♔',
                queen: '♕',
                rook: '♖',
                bishop: '♗',
                knight: '♘',
                pawn: '♙'
            },
            black: {
                king: '♚',
                queen: '♛',
                rook: '♜',
                bishop: '♝',
                knight: '♞',
                pawn: '♟'
            }
        };

        // Initialize the game
        function initGame() {
            setupEventListeners();
            updateSettings();
        }

        // Set up event listeners
        function setupEventListeners() {
            // Home screen buttons
            document.getElementById('singlePlayerBtn').addEventListener('click', () => selectGameMode('singlePlayer'));
            document.getElementById('twoPlayerBtn').addEventListener('click', () => selectGameMode('twoPlayer'));
            
            // Difficulty buttons
            document.querySelectorAll('.option-btn[data-difficulty]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.option-btn[data-difficulty]').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    gameState.difficulty = e.target.dataset.difficulty;
                });
            });
            
            // Settings
            document.getElementById('themeToggle').addEventListener('change', updateSettings);
            document.getElementById('soundToggle').addEventListener('change', updateSettings);
            document.getElementById('gameTime').addEventListener('change', updateSettings);
            
            // Start game button
            document.getElementById('startGameBtn').addEventListener('click', startGame);
            
            // Game screen buttons
            document.getElementById('undoBtn').addEventListener('click', handleUndo);
            document.getElementById('switchSidesBtn').addEventListener('click', switchSides);
            document.getElementById('newGameBtn').addEventListener('click', startNewGame);
            document.getElementById('homeBtn').addEventListener('click', goHome);
            
            // Modal buttons
            document.getElementById('rematchBtn').addEventListener('click', startNewGame);
            document.getElementById('closeModalBtn').addEventListener('click', () => {
                document.getElementById('gameOverModal').classList.remove('active');
            });
        }

        // Update settings from home screen
        function updateSettings() {
            // Theme
            gameState.theme = document.getElementById('themeToggle').checked ? 'dark' : 'light';
            document.body.setAttribute('data-theme', gameState.theme);
            
            // Sound
            gameState.soundEnabled = document.getElementById('soundToggle').checked;
            
            // Game time
            const gameTime = parseInt(document.getElementById('gameTime').value);
            gameState.timers.white = gameTime;
            gameState.timers.black = gameTime;
        }

        // Select game mode
        function selectGameMode(mode) {
            gameState.gameMode = mode;
            
            // Update UI
            document.getElementById('singlePlayerBtn').classList.toggle('active', mode === 'singlePlayer');
            document.getElementById('twoPlayerBtn').classList.toggle('active', mode === 'twoPlayer');
        }

        // Start game (transition to game screen)
        function startGame() {
            document.getElementById('homeScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
            
            createBoard();
            startNewGame();
            updateTimersDisplay();
        }

        // Go back to home screen
        function goHome() {
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('homeScreen').style.display = 'flex';
            stopTimers();
        }

        // Create the chessboard
        function createBoard() {
            const chessboard = document.getElementById('chessboard');
            chessboard.innerHTML = '';

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const square = document.createElement('div');
                    square.className = `square ${(row + col) % 2 === 0 ? 'light' : 'dark'}`;
                    square.dataset.row = row;
                    square.dataset.col = col;

                    // Add coordinates
                    if (row === 7) {
                        const fileCoord = document.createElement('div');
                        fileCoord.className = 'coordinates file-coord';
                        fileCoord.textContent = String.fromCharCode(97 + col);
                        square.appendChild(fileCoord);
                    }

                    if (col === 0) {
                        const rankCoord = document.createElement('div');
                        rankCoord.className = 'coordinates rank-coord';
                        rankCoord.textContent = 8 - row;
                        square.appendChild(rankCoord);
                    }

                    chessboard.appendChild(square);
                }
            }
            
            // Add click event listeners to squares
            document.querySelectorAll('.square').forEach(square => {
                square.addEventListener('click', handleSquareClick);
            });
        }

        // Set up the initial board position
        function setupBoard() {
            // Clear the board
            gameState.board = Array(8).fill().map(() => Array(8).fill(null));

            // Set up pawns
            for (let col = 0; col < 8; col++) {
                gameState.board[1][col] = { type: 'pawn', color: 'black', hasMoved: false };
                gameState.board[6][col] = { type: 'pawn', color: 'white', hasMoved: false };
            }

            // Set up other pieces
            const backRow = ['rook', 'knight', 'bishop', 'queen', 'king', 'bishop', 'knight', 'rook'];
            for (let col = 0; col < 8; col++) {
                gameState.board[0][col] = { type: backRow[col], color: 'black', hasMoved: false };
                gameState.board[7][col] = { type: backRow[col], color: 'white', hasMoved: false };
            }

            updateBoardDisplay();
        }

        // Update the visual representation of the board
        function updateBoardDisplay() {
            const squares = document.querySelectorAll('.square');
            squares.forEach(square => {
                const row = parseInt(square.dataset.row);
                const col = parseInt(square.dataset.col);
                const piece = gameState.board[row][col];

                // Clear the square
                square.textContent = '';
                square.classList.remove('selected', 'possible-move', 'possible-capture');

                // Add coordinates back if needed
                if (row === 7) {
                    const fileCoord = document.createElement('div');
                    fileCoord.className = 'coordinates file-coord';
                    fileCoord.textContent = String.fromCharCode(97 + col);
                    square.appendChild(fileCoord);
                }

                if (col === 0) {
                    const rankCoord = document.createElement('div');
                    rankCoord.className = 'coordinates rank-coord';
                    rankCoord.textContent = 8 - row;
                    square.appendChild(rankCoord);
                }

                // Add piece if present
                if (piece) {
                    const pieceElement = document.createElement('div');
                    pieceElement.textContent = pieces[piece.color][piece.type];
                    pieceElement.style.color = piece.color === 'white' ? '#ffffff' : '#000000';
                    pieceElement.style.textShadow = piece.color === 'white' 
                        ? '1px 1px 2px rgba(0,0,0,0.5)' 
                        : '1px 1px 2px rgba(255,255,255,0.5)';
                    pieceElement.style.fontSize = '2.5rem';
                    pieceElement.style.fontWeight = 'bold';
                    square.appendChild(pieceElement);
                }
            });

            // Highlight selected piece and possible moves
            if (gameState.selectedPiece) {
                const { row, col } = gameState.selectedPiece;
                const selectedSquare = document.querySelector(`.square[data-row="${row}"][data-col="${col}"]`);
                selectedSquare.classList.add('selected');

                gameState.possibleMoves.forEach(move => {
                    const moveSquare = document.querySelector(`.square[data-row="${move.row}"][data-col="${move.col}"]`);
                    if (gameState.board[move.row][move.col]) {
                        moveSquare.classList.add('possible-capture');
                    } else {
                        moveSquare.classList.add('possible-move');
                    }
                });
            }

            // Update player turn indicator
            document.getElementById('whitePlayer').classList.toggle('current-turn', gameState.currentPlayer === 'white');
            document.getElementById('blackPlayer').classList.toggle('current-turn', gameState.currentPlayer === 'black');
        }

        // Handle square clicks
        function handleSquareClick(e) {
            if (!gameState.gameActive) return;

            const row = parseInt(e.currentTarget.dataset.row);
            const col = parseInt(e.currentTarget.dataset.col);

            // If a piece is already selected
            if (gameState.selectedPiece) {
                // Check if the clicked square is a valid move
                const isValidMove = gameState.possibleMoves.some(move => 
                    move.row === row && move.col === col
                );

                if (isValidMove) {
                    // Make the move
                    makeMove(gameState.selectedPiece.row, gameState.selectedPiece.col, row, col);
                    return;
                }

                // If clicking on another piece of the same color, select that piece instead
                const piece = gameState.board[row][col];
                if (piece && piece.color === gameState.currentPlayer) {
                    selectPiece(row, col);
                    return;
                }

                // Otherwise, deselect the current piece
                deselectPiece();
            } else {
                // Select a piece if it belongs to the current player
                const piece = gameState.board[row][col];
                if (piece && piece.color === gameState.currentPlayer) {
                    selectPiece(row, col);
                }
            }
        }

        // Select a piece and show possible moves
        function selectPiece(row, col) {
            gameState.selectedPiece = { row, col };
            gameState.possibleMoves = getPossibleMoves(row, col);
            updateBoardDisplay();

            // Play selection sound if enabled
            if (gameState.soundEnabled) {
                // In a real app, this would play a sound
                console.log("Selection sound played");
            }
        }

        // Deselect the current piece
        function deselectPiece() {
            gameState.selectedPiece = null;
            gameState.possibleMoves = [];
            updateBoardDisplay();
        }

        // Get possible moves for a piece
        function getPossibleMoves(row, col) {
            const piece = gameState.board[row][col];
            if (!piece) return [];

            const moves = [];

            // Simplified move logic for demonstration
            // In a full implementation, this would include all chess rules
            switch (piece.type) {
                case 'pawn':
                    // Pawn moves
                    const direction = piece.color === 'white' ? -1 : 1;
                    
                    // Move forward one square
                    if (isValidSquare(row + direction, col) && !gameState.board[row + direction][col]) {
                        moves.push({ row: row + direction, col });
                        
                        // Move forward two squares from starting position
                        if (!piece.hasMoved && 
                            isValidSquare(row + 2 * direction, col) && 
                            !gameState.board[row + 2 * direction][col]) {
                            moves.push({ row: row + 2 * direction, col });
                        }
                    }
                    
                    // Capture diagonally
                    for (let dc of [-1, 1]) {
                        if (isValidSquare(row + direction, col + dc) && 
                            gameState.board[row + direction][col + dc] &&
                            gameState.board[row + direction][col + dc].color !== piece.color) {
                            moves.push({ row: row + direction, col: col + dc });
                        }
                    }
                    break;
                    
                case 'knight':
                    // Knight moves (L-shape)
                    const knightMoves = [
                        { dr: -2, dc: -1 }, { dr: -2, dc: 1 },
                        { dr: -1, dc: -2 }, { dr: -1, dc: 2 },
                        { dr: 1, dc: -2 }, { dr: 1, dc: 2 },
                        { dr: 2, dc: -1 }, { dr: 2, dc: 1 }
                    ];
                    
                    knightMoves.forEach(move => {
                        const newRow = row + move.dr;
                        const newCol = col + move.dc;
                        
                        if (isValidSquare(newRow, newCol) && 
                            (!gameState.board[newRow][newCol] || 
                             gameState.board[newRow][newCol].color !== piece.color)) {
                            moves.push({ row: newRow, col: newCol });
                        }
                    });
                    break;
                    
                case 'bishop':
                    // Bishop moves (diagonals)
                    addDirectionalMoves(moves, row, col, piece.color, [
                        { dr: -1, dc: -1 }, { dr: -1, dc: 1 },
                        { dr: 1, dc: -1 }, { dr: 1, dc: 1 }
                    ]);
                    break;
                    
                case 'rook':
                    // Rook moves (horizontal/vertical)
                    addDirectionalMoves(moves, row, col, piece.color, [
                        { dr: -1, dc: 0 }, { dr: 1, dc: 0 },
                        { dr: 0, dc: -1 }, { dr: 0, dc: 1 }
                    ]);
                    break;
                    
                case 'queen':
                    // Queen moves (all directions)
                    addDirectionalMoves(moves, row, col, piece.color, [
                        { dr: -1, dc: -1 }, { dr: -1, dc: 0 }, { dr: -1, dc: 1 },
                        { dr: 0, dc: -1 }, { dr: 0, dc: 1 },
                        { dr: 1, dc: -1 }, { dr: 1, dc: 0 }, { dr: 1, dc: 1 }
                    ]);
                    break;
                    
                case 'king':
                    // King moves (one square in any direction)
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            if (dr === 0 && dc === 0) continue;
                            
                            const newRow = row + dr;
                            const newCol = col + dc;
                            
                            if (isValidSquare(newRow, newCol) && 
                                (!gameState.board[newRow][newCol] || 
                                 gameState.board[newRow][newCol].color !== piece.color)) {
                                moves.push({ row: newRow, col: newCol });
                            }
                        }
                    }
                    break;
            }

            return moves;
        }

        // Helper function to add directional moves (for bishop, rook, queen)
        function addDirectionalMoves(moves, startRow, startCol, color, directions) {
            directions.forEach(dir => {
                let row = startRow + dir.dr;
                let col = startCol + dir.dc;
                
                while (isValidSquare(row, col)) {
                    if (!gameState.board[row][col]) {
                        // Empty square
                        moves.push({ row, col });
                    } else if (gameState.board[row][col].color !== color) {
                        // Capture opponent's piece
                        moves.push({ row, col });
                        break;
                    } else {
                        // Own piece, stop in this direction
                        break;
                    }
                    
                    row += dir.dr;
                    col += dir.dc;
                }
            });
        }

        // Check if a square is valid (within the board)
        function isValidSquare(row, col) {
            return row >= 0 && row < 8 && col >= 0 && col < 8;
        }

        // Make a move
        function makeMove(fromRow, fromCol, toRow, toCol) {
            const piece = gameState.board[fromRow][fromCol];
            
            // Save move for undo functionality
            gameState.moveHistory.push({
                from: { row: fromRow, col: fromCol },
                to: { row: toRow, col: toCol },
                piece: { ...piece },
                captured: gameState.board[toRow][toCol] ? { ...gameState.board[toRow][toCol] } : null
            });

            // Move the piece
            gameState.board[toRow][toCol] = { ...piece, hasMoved: true };
            gameState.board[fromRow][fromCol] = null;

            // Play move sound if enabled
            if (gameState.soundEnabled) {
                // In a real app, this would play a sound
                console.log("Move sound played");
            }

            // Check for capture
            if (gameState.moveHistory[gameState.moveHistory.length - 1].captured) {
                if (gameState.soundEnabled) {
                    // In a real app, this would play a capture sound
                    console.log("Capture sound played");
                }
            }

            // Switch player
            gameState.currentPlayer = gameState.currentPlayer === 'white' ? 'black' : 'white';
            
            // Deselect piece
            deselectPiece();
            
            // Update board display
            updateBoardDisplay();

            // Check for game over conditions
            checkGameOver();

            // If in single player mode and it's the AI's turn
            if (gameState.gameMode === 'singlePlayer' && gameState.currentPlayer === 'black' && gameState.gameActive) {
                setTimeout(makeAIMove, 500);
            }
        }

        // Make AI move (simplified)
        function makeAIMove() {
            // Find all possible moves for black pieces
            const possibleMoves = [];
            
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const piece = gameState.board[row][col];
                    if (piece && piece.color === 'black') {
                        const moves = getPossibleMoves(row, col);
                        moves.forEach(move => {
                            possibleMoves.push({
                                from: { row, col },
                                to: move
                            });
                        });
                    }
                }
            }
            
            // Select a random move (in a full implementation, this would use minimax)
            if (possibleMoves.length > 0) {
                const randomIndex = Math.floor(Math.random() * possibleMoves.length);
                const move = possibleMoves[randomIndex];
                makeMove(move.from.row, move.from.col, move.to.row, move.to.col);
            }
        }

        // Check for game over conditions
        function checkGameOver() {
            // Simplified check for demonstration
            // In a full implementation, this would check for checkmate, stalemate, etc.
            
            // For now, we'll just check if a king is captured
            let whiteKing = false;
            let blackKing = false;
            
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const piece = gameState.board[row][col];
                    if (piece && piece.type === 'king') {
                        if (piece.color === 'white') whiteKing = true;
                        if (piece.color === 'black') blackKing = true;
                    }
                }
            }
            
            if (!whiteKing) {
                endGame('Black wins!', 'Black has captured the white king');
            } else if (!blackKing) {
                endGame('White wins!', 'White has captured the black king');
            }
        }

        // End the game
        function endGame(title, message) {
            gameState.gameActive = false;
            stopTimers();
            
            document.getElementById('gameResult').textContent = title;
            document.getElementById('gameResultMessage').textContent = message;
            document.getElementById('gameOverModal').classList.add('active');
        }

        // Start a new game
        function startNewGame() {
            gameState.gameActive = true;
            gameState.currentPlayer = 'white';
            gameState.selectedPiece = null;
            gameState.possibleMoves = [];
            gameState.moveHistory = [];
            gameState.undoCount = 0;
            
            // Reset timers
            gameState.timers.white = parseInt(document.getElementById('gameTime').value);
            gameState.timers.black = parseInt(document.getElementById('gameTime').value);
            
            setupBoard();
            startTimers();
            
            // Close modals
            document.getElementById('gameOverModal').classList.remove('active');
        }

        // Handle undo move
        function handleUndo() {
            if (gameState.moveHistory.length === 0) return;
            
            // Allow unlimited undos in ad-free version
            undoMove();
        }

        // Undo the last move
        function undoMove() {
            if (gameState.moveHistory.length === 0) return;
            
            const lastMove = gameState.moveHistory.pop();
            
            // Restore the piece to its original position
            gameState.board[lastMove.from.row][lastMove.from.col] = lastMove.piece;
            
            // Restore captured piece or clear the destination square
            if (lastMove.captured) {
                gameState.board[lastMove.to.row][lastMove.to.col] = lastMove.captured;
            } else {
                gameState.board[lastMove.to.row][lastMove.to.col] = null;
            }
            
            // Switch back to the previous player
            gameState.currentPlayer = gameState.currentPlayer === 'white' ? 'black' : 'white';
            
            // Update board
            updateBoardDisplay();
        }

        // Switch sides (rotate board)
        function switchSides() {
            // In a full implementation, this would rotate the board
            alert("Board perspective switched");
        }

        // Start timers
        function startTimers() {
            if (gameState.timerInterval) {
                clearInterval(gameState.timerInterval);
            }
            
            gameState.timerInterval = setInterval(() => {
                if (gameState.gameActive) {
                    if (gameState.currentPlayer === 'white') {
                        gameState.timers.white--;
                    } else {
                        gameState.timers.black--;
                    }
                    
                    updateTimersDisplay();
                    
                    // Check for timeout
                    if (gameState.timers.white <= 0) {
                        endGame('Black wins!', 'White ran out of time');
                    } else if (gameState.timers.black <= 0) {
                        endGame('White wins!', 'Black ran out of time');
                    }
                }
            }, 1000);
        }

        // Stop timers
        function stopTimers() {
            if (gameState.timerInterval) {
                clearInterval(gameState.timerInterval);
                gameState.timerInterval = null;
            }
        }

        // Update timer display
        function updateTimersDisplay() {
            document.getElementById('whiteTimer').textContent = formatTime(gameState.timers.white);
            document.getElementById('blackTimer').textContent = formatTime(gameState.timers.black);
        }

        // Format time as MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Initialize the game when the page loads
        window.addEventListener('DOMContentLoaded', initGame);
    </script>
